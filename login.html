
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090d18;
            overflow: hidden;
            padding: 20px;
        }

        /* Background effects */
        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
        }

        .shape1 {
            width: 350px;
            height: 350px;
            background: #6246ea;
            top: -100px;
            left: -100px;
        }

        .shape2 {
            width: 350px;
            height: 350px;
            background: #00bcd4;
            bottom: -120px;
            right: -100px;
        }

        /* Login card */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 430px;
            padding: 45px 40px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: appear 0.8s ease;
        }

        .logo {
            color: #8b7bff;
            font-size: 23px;
            font-weight: 800;
            letter-spacing: 5px;
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: white;
            font-size: 32px;
            text-align: center;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #a5a9bb;
            font-size: 14px;
            text-align: center;
            margin-bottom: 35px;
        }

        /* Form inputs */
        .input-group {
            margin-bottom: 23px;
        }

        .input-group label {
            display: block;
            color: #e0e2eb;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: #777d91;
        }

        .input-group input:focus {
            border-color: #8271ff;
            box-shadow: 0 0 12px rgba(130, 113, 255, 0.3);
        }

        /* Remember and forgot password */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-bottom: 28px;
            color: #a5a9bb;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .remember input {
            accent-color: #8271ff;
        }

        a {
            color: #9a8cff;
            text-decoration: none;
            transition: 0.3s;
        }

        a:hover {
            color: white;
        }

        /* Login button */
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #7866ff, #5744df);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button span {
            margin-left: 8px;
            font-size: 18px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(120, 102, 255, 0.4);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 28px 0;
            color: #777d91;
            font-size: 11px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
        }

        /* Sign up */
        .signup {
            color: #a5a9bb;
            font-size: 13px;
            text-align: center;
        }

        .signup a {
            font-weight: 600;
            margin-left: 4px;
        }

        .footer {
            color: #686d80;
            text-align: center;
            font-size: 10px;
            margin-top: 35px;
        }

        /* Animation */
        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 35px 25px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="shape shape1"></div>
    <div class="shape shape2"></div>

    <div class="login-container">

        

        <h1>Welcome Back</h1>
        <p class="subtitle">
            Enter your credentials to access your account.
        </p>

        <form>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email"
                    placeholder="name@example.com" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password"
                    placeholder="Enter your password" required>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot password?</a>
            </div>

            <button type="submit">
                Sign In <span>→</span>
            </button>
        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <p class="signup">
            Don't have an account?
            <a href="#">Create account</a>
        </p>


    </div>

</body>
</html>
