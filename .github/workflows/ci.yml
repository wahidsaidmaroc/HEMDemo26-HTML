name: CI HEm HTML

on:
  push:

jobs:
  validate-html:
    name: Validate HTML documents
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check HTML document structure
        run: python scripts/validate_html.py
