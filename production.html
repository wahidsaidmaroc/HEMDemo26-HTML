
<!DOCTYPE html>
<html>
<head>
    <title>Production</title>
</head>
<body>

    <h1>Gestion de Production</h1>

    <label>Nom du produit :</label>
    <input type="text" placeholder="Produit">

    <br><br>

    <label>Quantité :</label>
    <input type="number" placeholder="Quantité">

    <br><br>

    <label>Date :</label>
    <input type="date">

    <br><br>

    <button>Ajouter</button>

    <h2>Liste des productions</h2>

    <table border="1">
        <tr>
            <th>Produit</th>
            <th>Quantité</th>
            <th>Date</th>
        </tr>
        <tr>
            <td>Ordinateur</td>
            <td>10</td>
            <td>17/11/2026</td>
        </tr>
    </table>

</body>
</html>
